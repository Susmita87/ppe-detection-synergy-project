# Fixed BoT-SORT tracker configuration

tracker_type: botsort 
model: auto # Position matters sometimes in SimpleNamespace
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.7
track_buffer: 90
match_thresh: 0.8
fuse_score: True

# Parameters for BoT-SORT
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True
