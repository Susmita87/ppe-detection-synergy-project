<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
</head>

<body style="background:black; color:white;">
    <div id="root"></div>
    <script src="cordova.js"></script>
    <script src="js/react.production.min.js"></script>
    <script src="js/react-dom.production.min.js"></script>
    <script>
        const cElement = React.createElement;
        //10.0.2.2 → host machine (your laptop) 
        //connect to phone : IP address of your laptop (check with ipconfig) and ensure both devices are on the same network
        const API_BASE = "http://192.168.1.33:8000";

        // Camera Capture
        document.addEventListener('deviceready', function () {
            console.log("Device ready, camera available:", !!navigator.camera);
        });


        function CameraView({ API_BASE, result, setResult }) {

            const videoRef = React.useRef(null);
            const canvasRef = React.useRef(null);

            const [cameraOn, setCameraOn] = React.useState(false);
            const [continuousMode, setContinuousMode] = React.useState(false);

            let intervalRef = null;

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });

                    videoRef.current.srcObject = stream;
                    setCameraOn(true);

                } catch (err) {
                    alert("Camera access failed: " + err.message);
                }
            }

            function stopCamera() {
                const stream = videoRef.current.srcObject;

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                setCameraOn(false);
                stopContinuousCapture();
            }

            async function captureAndSend() {
                const video = videoRef.current;
                const canvas = canvasRef.current;

                const ctx = canvas.getContext('2d');

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                ctx.drawImage(video, 0, 0);

                canvas.toBlob(async (blob) => {

                    const formData = new FormData();
                    formData.append('file', blob, 'frame.jpg');

                    try {
                        const res = await fetch(API_BASE + '/predict', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await res.json();
                        setResult(data);

                    } catch (err) {
                        console.log(err);
                    }

                }, 'image/jpeg', 0.8);
            }

            function startContinuousCapture() {
                setContinuousMode(true);

                intervalRef = setInterval(() => {
                    captureAndSend();
                }, 2000); // every 2 sec
            }

            function stopContinuousCapture() {
                setContinuousMode(false);

                if (intervalRef) {
                    clearInterval(intervalRef);
                    intervalRef = null;
                }
            }

            function captureImage() {
                if (!navigator.camera) {
                    alert("Camera not available. Check plugin/deviceready.");
                    return;
                }

                navigator.camera.getPicture(
                    function (imageURI) {

                        // FIX: convert URI → blob correctly
                        window.resolveLocalFileSystemURL(imageURI, function (fileEntry) {

                            fileEntry.file(function (file) {

                                const reader = new FileReader();

                                reader.onloadend = async function () {

                                    const blob = new Blob(
                                        [new Uint8Array(this.result)],
                                        { type: 'image/jpeg' }
                                    );

                                    const formData = new FormData();
                                    formData.append('file', blob, 'camera.jpg');

                                    try {
                                        const res = await fetch(API_BASE + '/predict', {
                                            method: 'POST',
                                            body: formData
                                        });

                                        const data = await res.json();
                                        console.log("RESULT:", data);
                                        setResult(data);

                                    } catch (err) {
                                        alert("Upload error: " + err.message);
                                    }
                                };

                                reader.readAsArrayBuffer(file);

                            });

                        }, function (err) {
                            alert("File resolve failed: " + err.code);
                        });

                    },
                    function (err) {
                        alert("Camera failed: " + err);
                    },
                    {
                        quality: 80,
                        destinationType: Camera.DestinationType.FILE_URI,
                        encodingType: Camera.EncodingType.JPEG,
                        correctOrientation: true,
                        targetWidth: 1024,
                        targetHeight: 1024
                    }
                );
            }

            return cElement('div', {}, [
                cElement('h2', { key: 'h' }, 'Camera Mode'),

                cElement('button', {
                    key: 'btn',
                    onClick: captureImage,
                    style: {
                        padding: '12px',
                        background: '#6366f1',
                        color: 'white',
                        border: 'none',
                        width: '100%',
                        marginBottom: '10px'
                    }
                }, 'Capture Image'),

                result && cElement('p', { key: 's' },
                    result.violations_detected ? 'Violation' : 'Safe'
                ),

                result && result.processed_image && (function () {
                    const imageSrc =
                        result.processed_image.startsWith("data:")
                            ? result.processed_image
                            : "data:image/jpeg;base64," + result.processed_image;
                    return cElement('img', {
                        key: 'img',
                        src: imageSrc,
                        style: { width: '100%', marginTop: '10px' }
                    });
                })(),

                // small JSON summary
                result && cElement('pre', {
                    key: 'json',
                    style: { fontSize: '10px', color: '#0f0', maxHeight: '120px', overflow: 'auto' }
                }, JSON.stringify({
                    total_detections: result.total_detections,
                    violations_detected: result.violations_detected
                }, null, 2))
            ]);
        }



        //end camera capture

        function UploadView({ API_BASE, result, setResult }) {
            const [loading, setLoading] = React.useState(false);

            async function handleFile(e) {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                setLoading(true);
                try {
                    const res = await fetch(API_BASE + '/predict', { method: 'POST', body: formData });
                    const text = await res.text();
                    const data = JSON.parse(text);
                    setResult(data);
                } catch (err) {
                    alert("Error: " + err.message);
                }
                setLoading(false);
            }

            return cElement('div', {}, [
                cElement('h2', { key: 'h' }, 'Upload Mode'),
                cElement('input', { key: 'i', type: 'file', onChange: handleFile }),
                loading && cElement('p', { key: 'l' }, 'Processing...'),

                // status
                result && cElement('p', { key: 's' },
                    result.violations_detected ? '⚠️ Violation' : '✅ Safe'
                ),

                // image (handles with/without prefix)
                result && result.processed_image && (function () {
                    const imageSrc =
                        result.processed_image.startsWith("data:")
                            ? result.processed_image
                            : "data:image/jpeg;base64," + result.processed_image;

                    return cElement('img', {
                        key: 'img',
                        src: imageSrc,
                        style: { width: '100%', marginTop: '10px' }
                    });
                })(),

                // small JSON summary
                result && cElement('pre', {
                    key: 'json',
                    style: { fontSize: '10px', color: '#0f0', maxHeight: '120px', overflow: 'auto' }
                }, JSON.stringify({
                    total_detections: result.total_detections,
                    violations_detected: result.violations_detected
                }, null, 2))
            ]);
        }

        function SettingsView() {
            return cElement('div', {}, [
                cElement('h2', {}, 'Settings'),
                cElement('input', { placeholder: 'Server URL', style: { width: '100%' } })
            ]);
        }

        function App() {
            const [tab, setTab] = React.useState('camera');
            const [result, setResult] = React.useState(null);   // add here

            function TabButton(name) {
                return cElement(
                    'button',
                    {
                        onClick: () => {
                            setTab(name);
                            setResult(null); // clear previous result when switching tabs
                        },
                        style: {
                            flex: 1,
                            padding: '10px',
                            background: tab === name ? '#6366f1' : '#333',
                            color: 'white',
                            border: 'none'
                        }
                    },
                    name.toUpperCase()
                );
            }

            return cElement('div', { style: { color: 'white', padding: '10px', background: '#111', height: '100vh' } }, [
                cElement('h1', {}, 'PPE Detection'),

                cElement('div', { style: { display: 'flex', marginBottom: '10px' } }, [
                    TabButton('camera'),
                    TabButton('upload'),
                    TabButton('settings')
                ]),

                // pass result + setResult to both views
                tab === 'camera'
                    ? cElement(CameraView, { API_BASE, result, setResult })
                    : tab === 'upload'
                        ? cElement(UploadView, { API_BASE, result, setResult })
                        : cElement(SettingsView)
            ]);
        }

        function renderApp() {
            console.log("Rendering app...");
            console.log("Camera object:", navigator.camera);

            ReactDOM.render(
                cElement(App),
                document.getElementById('root')
            );
        }

        // Try Cordova first
        document.addEventListener('deviceready', function () {
            console.log("Device ready fired");
            renderApp();
        });

        // Fallback (VERY IMPORTANT)
        setTimeout(() => {
            if (!window.cordova) {
                console.log("No cordova, fallback render");
                renderApp();
            }
        }, 1000);
    </script>
</body>

</html>
